#Goal: Push frontened on Docker hub using GitHub actions setup
name: CI 

on: 
  push:
    branches: [master]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v7

    - name: Docker Setup [login]
      uses: docker/login-action@v4
      with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Debug files
      run: |
        pwd
        ls -la
        find . -iname "*dockerfile*" -not -path "./.git/*"

    - name: Docker Push and Build
      uses: docker/build-push-action@v7
      with:
        context: ./frontend          # <-- apna frontend folder
        push: true
        tags: ${{ vars.DOCKERHUB_USERNAME }}/devboard-fe-master:latest
      
          
    
  
    
